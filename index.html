<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像一括圧縮アプリ</title>
    <style>
        :root {
            --color-primary: #2180c1;
            --color-primary-hover: #1d6eaa;
            --color-bg: #fafaf8;
            --color-surface: #ffffff;
            --color-text: #133436;
            --color-text-secondary: #626c70;
            --color-success: #2180c1;
            --color-border: #d4d4d4;
            --color-error: #c01527;
            --color-warning: #a84d2f;
        }

        * {
            box-sizing: border-box;
        }

        html {
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.5;
            color: var(--color-text);
            background-color: var(--color-bg);
        }

        body {
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0 0 8px 0;
            letter-spacing: -0.01em;
        }

        .subtitle {
            color: var(--color-text-secondary);
            margin: 0 0 32px 0;
            font-size: 14px;
        }

        .upload-area {
            background: var(--color-surface);
            border: 2px dashed var(--color-border);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 250ms cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 32px;
        }

        .upload-area:hover {
            border-color: var(--color-primary);
            background: rgba(33, 128, 193, 0.02);
        }

        .upload-area.dragover {
            border-color: var(--color-primary);
            background: rgba(33, 128, 193, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
        }

        .upload-area input {
            display: none;
        }

        .upload-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .upload-text {
            font-size: 16px;
            font-weight: 500;
            margin: 0 0 4px 0;
        }

        .upload-hint {
            color: var(--color-text-secondary);
            font-size: 12px;
        }

        .settings {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 32px;
            display: none;
        }

        .settings.active {
            display: block;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-weight: 500;
            font-size: 12px;
        }

        .form-control {
            padding: 8px 12px;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-control:focus {
            outline: 2px solid var(--color-primary);
            outline-offset: -1px;
            border-color: var(--color-primary);
        }

        .quality-value {
            display: inline-block;
            background: rgba(33, 128, 193, 0.1);
            color: var(--color-primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            margin-left: 8px;
        }

        .file-list {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 32px;
            display: none;
        }

        .file-list.active {
            display: block;
        }

        .file-list-header {
            background: var(--color-bg);
            padding: 16px;
            border-bottom: 1px solid var(--color-border);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-count {
            color: var(--color-text-secondary);
            font-weight: normal;
            font-size: 13px;
        }

        .file-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-name {
            flex: 1;
            font-size: 13px;
            word-break: break-all;
        }

        .file-size {
            color: var(--color-text-secondary);
            font-size: 12px;
            margin-right: 16px;
        }

        .file-remove {
            background: transparent;
            border: none;
            color: var(--color-error);
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
        }

        .file-remove:hover {
            opacity: 0.7;
        }

        .results {
            display: none;
            gap: 16px;
        }

        .results.active {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }

        .result-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .result-image {
            width: 100%;
            height: 140px;
            background: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .result-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .result-info {
            padding: 12px;
        }

        .result-filename {
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 8px;
            word-break: break-all;
            line-height: 1.3;
        }

        .result-stats {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            padding: 8px;
            background: var(--color-bg);
            border-radius: 6px;
            font-size: 11px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
        }

        .stat-label {
            color: var(--color-text-secondary);
        }

        .stat-value {
            font-weight: 600;
            color: var(--color-text);
        }

        .compression-ratio {
            font-weight: 600;
            color: var(--color-success);
        }

        .result-btn {
            display: flex;
            gap: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 150ms cubic-bezier(0.16, 1, 0.3, 1);
            border: none;
            flex: 1;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--color-primary-hover);
        }

        .btn-primary:active {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--color-bg);
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }

        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 11px;
        }

        .btn-full {
            width: 100%;
        }

        .action-bar {
            display: none;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .action-bar.active {
            display: flex;
        }

        .action-bar .btn {
            flex: 0 1 auto;
            padding: 8px 16px;
            font-size: 14px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .message.active {
            display: block;
        }

        .message.success {
            background: rgba(33, 128, 193, 0.1);
            color: var(--color-success);
            border: 1px solid rgba(33, 128, 193, 0.2);
        }

        .message.error {
            background: rgba(192, 21, 47, 0.1);
            color: var(--color-error);
            border: 1px solid rgba(192, 21, 47, 0.2);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--color-border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--color-primary);
            width: 0%;
            transition: width 200ms ease-out;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 24px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .results.active {
                grid-template-columns: 1fr;
            }

            .action-bar {
                flex-direction: column;
            }

            .action-bar .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ 画像一括圧縮アプリ</h1>
        <p class="subtitle">複数の画像をドラッグ&ドロップして一気に圧縮できます</p>

        <div id="message" class="message"></div>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*" multiple>
            <div class="upload-icon">⬆️</div>
            <p class="upload-text">画像をドラッグ&ドロップ</p>
            <p class="upload-hint">または複数ファイル選択 (JPG, PNG, WebP)</p>
        </div>

        <div class="settings" id="settings">
            <div class="settings-grid">
                <div class="form-group">
                    <label class="form-label">品質レベル <span class="quality-value" id="qualityValue">80</span></label>
                    <input type="range" id="qualitySlider" class="form-control" min="10" max="100" value="80">
                    <span style="font-size: 12px; color: var(--color-text-secondary);">低いほど圧縮率が高い</span>
                </div>
                <div class="form-group">
                    <label class="form-label">最大幅 (px)</label>
                    <input type="number" id="maxWidth" class="form-control" value="2000" min="100">
                </div>
                <div class="form-group">
                    <label class="form-label">最大高さ (px)</label>
                    <input type="number" id="maxHeight" class="form-control" value="2000" min="100">
                </div>
                <div class="form-group">
                    <label class="form-label">出力形式</label>
                    <select id="outputFormat" class="form-control">
                        <option value="jpeg">JPEG</option>
                        <option value="png">PNG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="file-list" id="fileList">
            <div class="file-list-header">
                <span>ファイルリスト <span class="file-count" id="fileCount"></span></span>
            </div>
            <div id="fileListContent"></div>
        </div>

        <div class="action-bar" id="actionBar">
            <button class="btn btn-primary" id="compressAllBtn">すべて圧縮</button>
            <button class="btn btn-secondary" id="downloadAllBtn" style="display:none;">すべてダウンロード</button>
            <button class="btn btn-secondary" id="clearAllBtn">すべてクリア</button>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const settings = document.getElementById('settings');
        const fileList = document.getElementById('fileList');
        const fileListContent = document.getElementById('fileListContent');
        const fileCount = document.getElementById('fileCount');
        const results = document.getElementById('results');
        const actionBar = document.getElementById('actionBar');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValue = document.getElementById('qualityValue');
        const messageDiv = document.getElementById('message');
        const compressAllBtn = document.getElementById('compressAllBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');

        let selectedFiles = [];
        let compressedResults = [];

        // Upload area events
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFilesSelected(files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            handleFilesSelected(e.target.files);
        });

        // Quality slider
        qualitySlider.addEventListener('input', (e) => {
            qualityValue.textContent = e.target.value;
        });

        // Action buttons
        compressAllBtn.addEventListener('click', compressAllImages);
        document.getElementById('downloadAllBtn').addEventListener('click', downloadAllImages);
        clearAllBtn.addEventListener('click', clearAllFiles);

        function handleFilesSelected(files) {
            const newFiles = Array.from(files).filter(file => file.type.startsWith('image/'));

            if (newFiles.length === 0) {
                showMessage('画像ファイルを選択してください', 'error');
                return;
            }

            selectedFiles = newFiles;
            updateFileList();
            settings.classList.add('active');
        }

        function updateFileList() {
            fileCount.textContent = `${selectedFiles.length}個`;
            fileListContent.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <div class="file-name">${file.name}</div>
                    <div class="file-size">${formatBytes(file.size)}</div>
                    <button class="file-remove" onclick="removeFile(${index})">×</button>
                </div>
            `).join('');
            fileList.classList.add('active');
            actionBar.classList.add('active');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            if (selectedFiles.length === 0) {
                fileList.classList.remove('active');
                actionBar.classList.remove('active');
            } else {
                updateFileList();
            }
        }

        function clearAllFiles() {
            selectedFiles = [];
            compressedResults = [];
            fileInput.value = '';
            fileList.classList.remove('active');
            actionBar.classList.remove('active');
            settings.classList.remove('active');
            results.classList.remove('active');
            messageDiv.classList.remove('active');
        }

        function compressAllImages() {
            if (selectedFiles.length === 0) return;

            compressedResults = [];
            compressAllBtn.disabled = true;
            compressAllBtn.textContent = '圧縮中...';

            let processed = 0;

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();

                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;

                    img.onload = () => {
                        const quality = parseInt(qualitySlider.value) / 100;
                        const maxWidth = parseInt(document.getElementById('maxWidth').value);
                        const maxHeight = parseInt(document.getElementById('maxHeight').value);
                        const format = document.getElementById('outputFormat').value;

                        let { width, height } = calculateDimensions(img.width, img.height, maxWidth, maxHeight);

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const mimeType = format === 'webp' ? 'image/webp' : format === 'png' ? 'image/png' : 'image/jpeg';

                        canvas.toBlob(
                            (blob) => {
                                const compressionRatio = ((1 - blob.size / file.size) * 100).toFixed(1);
                                compressedResults.push({
                                    blob: blob,
                                    originalFile: file,
                                    width: width,
                                    height: height,
                                    ratio: compressionRatio
                                });

                                processed++;

                                if (processed === selectedFiles.length) {
                                    displayResults();
                                    compressAllBtn.disabled = false;
                                    compressAllBtn.textContent = 'すべて圧縮';
                                    showMessage(`✓ ${selectedFiles.length}個のファイルを圧縮完了`, 'success');
                                }
                            },
                            mimeType,
                            quality
                        );
                    };

                    img.onerror = () => {
                        processed++;
                        showMessage(`${file.name}の読み込みに失敗しました`, 'error');
                        if (processed === selectedFiles.length) {
                            compressAllBtn.disabled = false;
                            compressAllBtn.textContent = 'すべて圧縮';
                        }
                    };
                };

                reader.onerror = () => {
                    processed++;
                    showMessage('ファイルの読み込みに失敗しました', 'error');
                    if (processed === selectedFiles.length) {
                        compressAllBtn.disabled = false;
                        compressAllBtn.textContent = 'すべて圧縮';
                    }
                };

                reader.readAsDataURL(file);
            });
        }

        function calculateDimensions(imgWidth, imgHeight, maxWidth, maxHeight) {
            let width = imgWidth;
            let height = imgHeight;

            if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
            }

            if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
            }

            return { width, height };
        }

        function displayResults() {
            const resultHTML = compressedResults.map((result, index) => `
                <div class="result-card">
                    <div class="result-image">
                        <img src="${URL.createObjectURL(result.blob)}" alt="${result.originalFile.name}">
                    </div>
                    <div class="result-info">
                        <div class="result-filename">${result.originalFile.name}</div>
                        <div class="result-stats">
                            <div class="stat-row">
                                <span class="stat-label">元:</span>
                                <span class="stat-value">${formatBytes(result.originalFile.size)}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">圧縮:</span>
                                <span class="stat-value">${formatBytes(result.blob.size)}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">削減:</span>
                                <span class="stat-value compression-ratio">${result.ratio}%</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">解像度:</span>
                                <span class="stat-value">${result.width}×${result.height}</span>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-sm btn-full" onclick="downloadImage(${index})">DL</button>
                    </div>
                </div>
            `).join('');

            results.innerHTML = resultHTML;
            results.classList.add('active');
            document.getElementById('downloadAllBtn').style.display = 'block';
        }

        function downloadImage(index) {
            const result = compressedResults[index];
            const extension = document.getElementById('outputFormat').value === 'webp' ? 'webp' : document.getElementById('outputFormat').value === 'png' ? 'png' : 'jpg';
            const baseName = result.originalFile.name.split('.')[0];
            const filename = `${baseName}_compressed.${extension}`;
            
            // BlobをDataURLに変換してダウンロード
            const reader = new FileReader();
            reader.onload = function(e) {
                const link = document.createElement('a');
                link.href = e.target.result;
                link.download = filename;
                link.click();
            };
            reader.readAsDataURL(result.blob);
        }

        function downloadAllImages() {
            if (compressedResults.length === 0) return;
            
            compressedResults.forEach((result, index) => {
                setTimeout(() => {
                    downloadImage(index);
                }, index * 300);
            });
            
            showMessage(`✓ ${compressedResults.length}個のファイルをダウンロード中...`, 'success');
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message active ${type}`;
            setTimeout(() => {
                messageDiv.classList.remove('active');
            }, 4000);
        }
    </script>
</body>
</html>
