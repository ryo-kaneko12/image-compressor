<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像一括圧縮</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🖼️ 画像一括圧縮</h1>
        <p class="subtitle">複数の画像をドラッグ&ドロップして一気に圧縮できます</p>

        <div id="message" class="message"></div>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*" multiple>
            <div class="upload-icon">⬆️</div>
            <p class="upload-text">画像をドラッグ&ドロップ</p>
            <p class="upload-hint">または複数ファイル選択 (JPG, PNG, WebP)</p>
        </div>
<p>圧縮したい画像をアップロードしてください。<br>画像は複数枚アップロードできます。<br>画像圧縮はブラウザで処理されるため、サーバーなどに保存されることはありません。
    
</p>
        <div class="settings" id="settings">
            <div class="settings-grid">
                <div class="form-group">
                    <label class="form-label">品質レベル <span class="quality-value" id="qualityValue">80</span></label>
                    <input type="range" id="qualitySlider" class="form-control" min="10" max="100" value="80">
                    <span style="font-size: 12px; color: var(--color-text-secondary);">低いほど圧縮率が高い</span>
                </div>
                <div class="form-group">
                    <label class="form-label">最大幅 (px)</label>
                    <input type="number" id="maxWidth" class="form-control" value="2000" min="100">
                </div>
                <div class="form-group">
                    <label class="form-label">最大高さ (px)</label>
                    <input type="number" id="maxHeight" class="form-control" value="2000" min="100">
                </div>
                <div class="form-group">
                    <label class="form-label">出力形式</label>
                    <select id="outputFormat" class="form-control">
                        <option value="jpeg">JPEG</option>
                        <option value="png">PNG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="file-list" id="fileList">
            <div class="file-list-header">
                <span>ファイルリスト <span class="file-count" id="fileCount"></span></span>
            </div>
            <div id="fileListContent"></div>
        </div>

        <div class="action-bar" id="actionBar">
            <button class="btn btn-primary" id="compressAllBtn">すべて圧縮</button>
            <button class="btn btn-secondary" id="downloadAllBtn" style="display:none;">すべてダウンロード</button>
            <button class="btn btn-secondary" id="clearAllBtn">すべてクリア</button>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const settings = document.getElementById('settings');
        const fileList = document.getElementById('fileList');
        const fileListContent = document.getElementById('fileListContent');
        const fileCount = document.getElementById('fileCount');
        const results = document.getElementById('results');
        const actionBar = document.getElementById('actionBar');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValue = document.getElementById('qualityValue');
        const messageDiv = document.getElementById('message');
        const compressAllBtn = document.getElementById('compressAllBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');

        let selectedFiles = [];
        let compressedResults = [];

        // Upload area events
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFilesSelected(files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            handleFilesSelected(e.target.files);
        });

        // Quality slider
        qualitySlider.addEventListener('input', (e) => {
            qualityValue.textContent = e.target.value;
        });

        // Action buttons
        compressAllBtn.addEventListener('click', compressAllImages);
        document.getElementById('downloadAllBtn').addEventListener('click', downloadAllImages);
        clearAllBtn.addEventListener('click', clearAllFiles);

        function handleFilesSelected(files) {
            const newFiles = Array.from(files).filter(file => file.type.startsWith('image/'));

            if (newFiles.length === 0) {
                showMessage('画像ファイルを選択してください', 'error');
                return;
            }

            selectedFiles = newFiles;
            updateFileList();
            settings.classList.add('active');
        }

        function updateFileList() {
            fileCount.textContent = `${selectedFiles.length}個`;
            fileListContent.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <div class="file-name">${file.name}</div>
                    <div class="file-size">${formatBytes(file.size)}</div>
                    <button class="file-remove" onclick="removeFile(${index})">×</button>
                </div>
            `).join('');
            fileList.classList.add('active');
            actionBar.classList.add('active');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            if (selectedFiles.length === 0) {
                fileList.classList.remove('active');
                actionBar.classList.remove('active');
            } else {
                updateFileList();
            }
        }

        function clearAllFiles() {
            selectedFiles = [];
            compressedResults = [];
            fileInput.value = '';
            fileList.classList.remove('active');
            actionBar.classList.remove('active');
            settings.classList.remove('active');
            results.classList.remove('active');
            messageDiv.classList.remove('active');
        }

        function compressAllImages() {
            if (selectedFiles.length === 0) return;

            compressedResults = [];
            compressAllBtn.disabled = true;
            compressAllBtn.textContent = '圧縮中...';

            let processed = 0;

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();

                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;

                    img.onload = () => {
                        const quality = parseInt(qualitySlider.value) / 100;
                        const maxWidth = parseInt(document.getElementById('maxWidth').value);
                        const maxHeight = parseInt(document.getElementById('maxHeight').value);
                        const format = document.getElementById('outputFormat').value;

                        let { width, height } = calculateDimensions(img.width, img.height, maxWidth, maxHeight);

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const mimeType = format === 'webp' ? 'image/webp' : format === 'png' ? 'image/png' : 'image/jpeg';

                        canvas.toBlob(
                            (blob) => {
                                const compressionRatio = ((1 - blob.size / file.size) * 100).toFixed(1);
                                compressedResults.push({
                                    blob: blob,
                                    originalFile: file,
                                    width: width,
                                    height: height,
                                    ratio: compressionRatio
                                });

                                processed++;

                                if (processed === selectedFiles.length) {
                                    displayResults();
                                    compressAllBtn.disabled = false;
                                    compressAllBtn.textContent = 'すべて圧縮';
                                    showMessage(`✓ ${selectedFiles.length}個のファイルを圧縮完了`, 'success');
                                }
                            },
                            mimeType,
                            quality
                        );
                    };

                    img.onerror = () => {
                        processed++;
                        showMessage(`${file.name}の読み込みに失敗しました`, 'error');
                        if (processed === selectedFiles.length) {
                            compressAllBtn.disabled = false;
                            compressAllBtn.textContent = 'すべて圧縮';
                        }
                    };
                };

                reader.onerror = () => {
                    processed++;
                    showMessage('ファイルの読み込みに失敗しました', 'error');
                    if (processed === selectedFiles.length) {
                        compressAllBtn.disabled = false;
                        compressAllBtn.textContent = 'すべて圧縮';
                    }
                };

                reader.readAsDataURL(file);
            });
        }

        function calculateDimensions(imgWidth, imgHeight, maxWidth, maxHeight) {
            let width = imgWidth;
            let height = imgHeight;

            if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
            }

            if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
            }

            return { width, height };
        }

        function displayResults() {
            const resultHTML = compressedResults.map((result, index) => `
                <div class="result-card">
                    <div class="result-image">
                        <img src="${URL.createObjectURL(result.blob)}" alt="${result.originalFile.name}">
                    </div>
                    <div class="result-info">
                        <div class="result-filename">${result.originalFile.name}</div>
                        <div class="result-stats">
                            <div class="stat-row">
                                <span class="stat-label">元:</span>
                                <span class="stat-value">${formatBytes(result.originalFile.size)}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">圧縮:</span>
                                <span class="stat-value">${formatBytes(result.blob.size)}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">削減:</span>
                                <span class="stat-value compression-ratio">${result.ratio}%</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">解像度:</span>
                                <span class="stat-value">${result.width}×${result.height}</span>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-sm btn-full" onclick="downloadImage(${index})">DL</button>
                    </div>
                </div>
            `).join('');

            results.innerHTML = resultHTML;
            results.classList.add('active');
            document.getElementById('downloadAllBtn').style.display = 'block';
        }

        function downloadImage(index) {
            const result = compressedResults[index];
            const extension = document.getElementById('outputFormat').value === 'webp' ? 'webp' : document.getElementById('outputFormat').value === 'png' ? 'png' : 'jpg';
            const baseName = result.originalFile.name.split('.')[0];
            const filename = `${baseName}_compressed.${extension}`;
            
            // BlobをDataURLに変換してダウンロード
            const reader = new FileReader();
            reader.onload = function(e) {
                const link = document.createElement('a');
                link.href = e.target.result;
                link.download = filename;
                link.click();
            };
            reader.readAsDataURL(result.blob);
        }

        function downloadAllImages() {
            if (compressedResults.length === 0) return;
            
            compressedResults.forEach((result, index) => {
                setTimeout(() => {
                    downloadImage(index);
                }, index * 300);
            });
            
            showMessage(`✓ ${compressedResults.length}個のファイルをダウンロード中...`, 'success');
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message active ${type}`;
            setTimeout(() => {
                messageDiv.classList.remove('active');
            }, 4000);
        }
    </script>
</body>
</html>
